<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DICKA · Lector QR</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>*{box-sizing:border-box}body{background:#061626;color:#eef5ff;font:16px Arial,sans-serif;margin:0;padding:20px}main{max-width:540px;margin:auto}h1{font-size:22px;color:#38bdf8}p{line-height:1.5;color:#c4d3e4}#reader{background:#101f30;border-radius:14px;overflow:hidden;margin:16px 0}button{width:100%;padding:14px;border:0;border-radius:10px;background:#38bdf8;color:#061626;font-weight:700;font-size:16px;margin:7px 0}button.secondary{background:#24475e;color:white}#estado{padding:12px;background:#142b42;border-radius:10px;white-space:pre-wrap}input{width:100%;padding:13px;border-radius:8px;border:1px solid #60748a;background:#101f30;color:white}</style></head><body><main><h1>📷 DICKA · Lector QR</h1><p>Apunta la cámara trasera al código. Este lector no recibe contraseñas ni datos del operador.</p><div id="reader"></div><div id="estado" role="status">Preparando cámara...</div><button id="iniciar">Activar cámara</button><button id="copiar" class="secondary" hidden>Copiar código leído</button><button id="volver" class="secondary">Volver a QR Pro</button><p id="ayuda">Si el navegador solicita permiso para usar la cámara, elige Permitir. Si no vuelve automáticamente, copia el código y pégalo en QR Pro.</p><input id="codigo" readonly hidden aria-label="Código leído"></main>
<script>
const REGEX=/^QR-[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i;
const $=id=>document.getElementById(id);let lector=null,leyendo=false,codigo='';
function estado(t){$('estado').textContent=t}
async function detener(){if(!lector)return;const l=lector;lector=null;try{await l.stop()}catch(e){}try{l.clear()}catch(e){}}
async function encontrado(texto){if(leyendo)return;const c=String(texto||'').trim();if(!REGEX.test(c)){estado('QR detectado, pero no corresponde a un pase QR Pro.');return}leyendo=true;codigo=c;$('codigo').hidden=false;$('codigo').value=c;$('copiar').hidden=false;estado('✓ QR reconocido. Regresando al sistema...');if(navigator.vibrate)navigator.vibrate(150);await detener();
// El navegador entrega el resultado a la pestaña que abrió el lector.
try{if(window.opener&&!window.opener.closed){window.opener.postMessage({tipo:'DICKA_QRPRO_LECTURA',codigo:c},'*');setTimeout(()=>window.close(),500);return}}catch(e){}
estado('✓ QR leído. Copia el código, regresa a QR Pro y pégalo en el campo Código QR.');}
async function iniciar(){if(lector||leyendo)return; if(!window.isSecureContext){estado('Se requiere HTTPS para abrir la cámara.');return}if(typeof Html5Qrcode==='undefined'){estado('No se pudo cargar la biblioteca del lector. Revisa la conexión.');return}const l=new Html5Qrcode('reader');lector=l;$('iniciar').disabled=true;estado('Solicitando permiso para usar la cámara...');try{await l.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>{let n=Math.max(130,Math.min(300,Math.floor(Math.min(w,h)*.8)));return {width:n,height:n}}},encontrado,()=>{});estado('Cámara activa. Acerca el QR, aumenta el brillo y evita reflejos.')}catch(e){lector=null;$('iniciar').disabled=false;estado('No se pudo abrir la cámara. Verifica los permisos del navegador e inténtalo otra vez.')}}
$('iniciar').onclick=iniciar;$('copiar').onclick=async()=>{try{await navigator.clipboard.writeText(codigo);estado('Código copiado. Regresa a QR Pro y pégalo.')}catch(e){$('codigo').select();estado('Selecciona y copia el código del campo inferior.')}};$('volver').onclick=()=>{window.close();estado('Regresa a la pestaña de QR Pro.')};window.addEventListener('pagehide',()=>{detener()});
// Autoinicio: si el navegador exige gesto del usuario, se conserva el botón.
iniciar();
</script></body></html>
